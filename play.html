<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Free Period</title>
  <meta name="theme-color" content="#05070c" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Free Period" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="themes.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" />
  <script src="fp/theme-boot.js"></script>
  <style>
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    .player { position: relative; display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
    /* the bar clears the notch / status bar (viewport-fit=cover; --sa-* are 0 on a desktop) */
    .bar {
      flex: none; height: calc(54px + var(--sa-t)); display: flex; align-items: center; gap: 10px;
      padding: var(--sa-t) max(12px, var(--sa-r)) 0 max(12px, var(--sa-l));
      background: rgba(10, 13, 22, 0.96); border-bottom: 1px solid var(--line);
    }
    .bar .logo svg { width: 30px; height: 30px; }
    .bar .wordmark { font-size: 17px; }
    .sep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; }
    .now { display: flex; flex-direction: column; min-width: 0; }
    .now strong { font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .now small { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tools { margin-left: auto; display: flex; gap: 6px; }
    .tool {
      height: 36px; padding: 0 12px; display: inline-flex; align-items: center; gap: 7px; border-radius: 10px; cursor: pointer;
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line); font-size: 14px; font-weight: 600; color: #d4dbef;
      transition: background 0.15s, border-color 0.15s;
    }
    .tool:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.18); }
    .tool svg { width: 16px; height: 16px; }
    .tool.main { background: var(--lime); color: #0a0f05; border-color: var(--lime); }
    .tool.main:hover { background: #d6ff6a; }

    .stage { position: relative; flex: 1; background: #000; }
    /* the game keeps out of the notch and the home bar (a black edge there instead) */
    .stage iframe {
      position: absolute; top: 0; left: var(--sa-l); width: calc(100% - var(--sa-l) - var(--sa-r)); height: calc(100% - var(--sa-b));
      border: 0; display: block; background: #000;
    }
    /* "Full screen" where the browser has no Fullscreen API (iPhone Safari): the bar folds away and the game gets the whole
       screen; the small button in the corner brings the bar back */
    .unfull { display: none; }
    body.immersive .bar { display: none; }
    body.immersive .stage iframe { top: var(--sa-t); height: calc(100% - var(--sa-t) - var(--sa-b)); }
    body.immersive .unfull {
      display: grid; place-items: center; position: fixed; z-index: 40; top: max(6px, var(--sa-t)); right: max(6px, var(--sa-r));
      width: 44px; height: 44px; padding: 0; border-radius: 50%; cursor: pointer; color: #fff; opacity: 0.75;
      background: rgba(5, 8, 14, 0.6); border: 1px solid rgba(255, 255, 255, 0.22);
    }
    .unfull svg { width: 18px; height: 18px; }

    /* "Rotate your phone": games that play sideways (games.js orientation: 'landscape'), on a phone held upright */
    .rotate {
      display: none; position: absolute; inset: calc(54px + var(--sa-t)) 0 0 0; z-index: 5; place-items: center;
      padding: 24px max(24px, var(--sa-r)) calc(24px + var(--sa-b)) max(24px, var(--sa-l));
      text-align: center; background: radial-gradient(80% 50% at 50% 30%, rgb(var(--lime-rgb) / 0.12), transparent 70%), var(--bg);
    }
    .rotate .box { display: grid; justify-items: center; gap: 14px; max-width: 320px; }
    .rotate .phone { width: 44px; height: 76px; border: 3px solid var(--lime); border-radius: 11px; box-shadow: 0 0 22px -4px rgb(var(--lime-rgb) / 0.7); animation: rot-turn 2.6s ease-in-out infinite; }
    .rotate .phone::after { content: ''; display: block; width: 14px; height: 3px; margin: 6px auto 0; border-radius: 2px; background: var(--lime); }
    @keyframes rot-turn { 0%, 18% { transform: rotate(0); } 48%, 78% { transform: rotate(-90deg); } 100% { transform: rotate(0); } }
    .rotate h2 { margin: 8px 0 0; font: 400 26px/1.1 'Bungee', 'Outfit', sans-serif; }
    .rotate p { margin: 0; color: var(--soft); font-size: 16px; line-height: 1.45; }
    .rotate .tool { margin-top: 6px; }
    @media (orientation: portrait) and (max-width: 599px) and (pointer: coarse) {
      body[data-orient="landscape"]:not(.rot-ok) .rotate { display: grid; }
    }
    body.immersive .rotate { top: 0; }
    @media (prefers-reduced-motion: reduce) { .rotate .phone { animation: none; transform: rotate(-90deg); } }

    .loader {
      position: absolute; inset: 0; display: grid; place-items: center; text-align: center; overflow: hidden;
      background: var(--bg); transition: opacity 0.45s ease;
    }
    .loader.gone { opacity: 0; pointer-events: none; }
    .loader .bg { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(28px) brightness(0.35) saturate(1.3); }
    .loader .box { position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 24px; max-width: 460px; }
    .loader h1 { margin: 0; font: 400 clamp(30px, 5vw, 46px)/1 'Bungee', 'Outfit', sans-serif; }
    .loader p { margin: 0; color: #c5cce0; font-size: 16px; line-height: 1.45; }
    .loader .why { font-size: 14px; color: var(--muted); min-height: 40px; }
    .spinner { width: 54px; height: 54px; border-radius: 50%; border: 4px solid rgba(255, 255, 255, 0.12); border-top-color: var(--lime); animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader .secs { font-variant-numeric: tabular-nums; color: var(--lime); font-weight: 700; }

    .missing { display: grid; place-items: center; height: 100%; text-align: center; gap: 12px; color: var(--muted); }
    .missing h1 { font: 400 28px 'Bungee', sans-serif; color: var(--text); margin: 0 0 8px; }

    @media (max-width: 640px) {
      .bar .wordmark, .sep, .tool .label { display: none; }
      .now small { display: none; }
    }
    .tool { white-space: nowrap; }
    /* touch screens: 44 x 44 buttons; a phone held sideways keeps the bar to icons so the game gets the room */
    @media (pointer: coarse) {
      .tool { min-height: 44px; min-width: 44px; justify-content: center; }
      .tools { gap: 4px; }
    }
    @media (pointer: coarse) and (max-height: 500px) {
      .bar .wordmark, .sep, .tool .label, .now small { display: none; }
    }
  </style>
</head>
<body>
  <div class="player">
    <div class="bar">
      <a class="logo" href="./" title="Back to all games">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <g class="bell" fill="none" stroke="#c6ff3d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 42h28l-3.5-5V27a10.5 10.5 0 0 0-21 0v10z" /><path d="M28 48a4.5 4.5 0 0 0 8 0" /><path d="M32 12v4" />
          </g>
          <circle cx="47" cy="17" r="6" fill="#3de0ff" />
        </svg>
        <span class="wordmark">FREE <b>PERIOD</b></span>
      </a>
      <span class="sep"></span>
      <div class="now"><strong id="title">Loading</strong><small id="controls"></small></div>
      <div class="tools">
        <div id="chat-btn" hidden></div>
        <button class="tool" id="reload" title="Reload the game">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg><span class="label">Reload</span>
        </button>
        <a class="tool" id="newtab" target="_blank" rel="noopener" title="Open the game in its own tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg><span class="label">New tab</span>
        </a>
        <button class="tool main" id="full" title="Fullscreen (Esc to leave)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="label">Fullscreen</span>
        </button>
      </div>
    </div>
    <div class="stage" id="stage"></div>
  </div>
  <button class="unfull" id="unfull" type="button" title="Show the bar" aria-label="Leave full screen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
  </button>

  <script src="games.js"></script>
  <script type="module" src="fp/play.js"></script>
</body>
</html>
