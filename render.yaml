# Render Blueprint for Free Period game servers (the games themselves are on GitHub Pages).
# Dashboard: New + -> Blueprint -> pick Seansaj5/freeperiod.
services:
  # Close Call multiplayer relay (rooms of up to 8; traffic is computed on each player's machine)
  - type: web
    name: freeperiod-closecall
    runtime: node
    plan: free
    # Virginia (US East) is the closest to New Jersey. Render can't move a service to another region later.
    region: virginia
    rootDir: games/close-call/server
    buildCommand: npm install --omit=dev
    startCommand: node index.js
    healthCheckPath: /health
    buildFilter:
      paths:
        - games/close-call/server/**
    envVars:
      - key: NODE_VERSION
        value: "22"

  # horror.exe multiplayer: the server runs each round with the game's shared code (games/horror-exe/shared)
  - type: web
    name: freeperiod-horror
    runtime: node
    plan: free
    # Virginia (US East) is the closest to New Jersey. Render can't move a service to another region later.
    region: virginia
    rootDir: games/horror-exe
    buildCommand: cd server && npm install --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /health
    buildFilter:
      paths:
        - games/horror-exe/server/**
        - games/horror-exe/shared/**
    envVars:
      - key: NODE_VERSION
        value: "22"

  # Brielle Battleroyal multiplayer: the server runs each match with the game's shared code (games/brielle-battleroyal/shared)
  - type: web
    name: freeperiod-brielle
    runtime: node
    plan: free
    # Virginia (US East) is the closest to New Jersey. Render can't move a service to another region later.
    region: virginia
    rootDir: games/brielle-battleroyal
    buildCommand: cd server && npm install --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /health
    buildFilter:
      paths:
        - games/brielle-battleroyal/server/**
        - games/brielle-battleroyal/shared/**
    envVars:
      - key: NODE_VERSION
        value: "22"
