<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Free Period</title>
  <meta name="description" content="Free Period: games made by us, for us." />
  <meta name="theme-color" content="#05070c" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Free Period" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="assets/fonts/bungee.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/outfit.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="ui.css" />
  <link rel="stylesheet" href="hub.css" />
  <link rel="stylesheet" href="themes.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" />
  <script src="fp/theme-boot.js"></script>
</head>
<body class="home">
  <div class="sky" aria-hidden="true">
    <i class="glow g1"></i><i class="glow g2"></i><i class="glow g3"></i>
    <i class="paper"></i>
    <i class="sweep"></i>
  </div>

  <header class="top">
    <div class="wrap top-in">
      <a class="logo" href="./" aria-label="Free Period home">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <g class="bell" fill="none" stroke="#c6ff3d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 42h28l-3.5-5V27a10.5 10.5 0 0 0-21 0v10z" /><path d="M28 48a4.5 4.5 0 0 0 8 0" /><path d="M32 12v4" />
          </g>
          <circle cx="47" cy="17" r="6" fill="#3de0ff" />
        </svg>
        <span class="wordmark">FREE <b>PERIOD</b></span>
      </a>
      <!-- Site nav: the same block on every hub page; aria-current="page" marks the page you are on. -->
      <nav class="fp-nav" aria-label="Free Period">
        <a class="nav-a" href="./" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8.5h10a4.5 4.5 0 0 1 4.4 5.4l-.6 3a2.5 2.5 0 0 1-4.3 1.2L14.2 16H9.8l-2.3 2.1a2.5 2.5 0 0 1-4.3-1.2l-.6-3A4.5 4.5 0 0 1 7 8.5zM8 11v3M6.5 12.5h3M15.5 11.5h.01M17.5 13.5h.01" /></svg>
          <span>Games</span>
        </a>
        <a class="nav-a" href="leaderboards.html" aria-label="Leaderboards">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20.5v-7h5v7M9.5 20.5v-12h5v12M14.5 20.5v-5h5v5M3 20.5h18" /></svg>
          <span class="nav-long">Leaderboards</span><span class="nav-short" aria-hidden="true">Leaders</span>
        </a>
        <span class="nav-chat" id="chat-btn" hidden></span><!-- Messages (fp/chat/button.js; hidden while chat is off) -->
        <a class="nav-a" href="trophies.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v6a4 4 0 0 1-8 0zM8 6H5.5a2.5 2.5 0 0 0 2.6 4.4M16 6h2.5a2.5 2.5 0 0 1-2.6 4.4M12 14v3.5M8.5 20.5h7M10 17.5h4v3h-4z" /></svg>
          <span>Trophies</span><i class="nav-dot" data-trophy-dot hidden></i>
        </a>
      </nav>
      <div class="clock" id="clock" aria-live="off"><span id="time">--:--</span><em id="mood">free period</em></div>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
        <input id="q" type="search" placeholder="Search games" autocomplete="off" spellcheck="false" aria-label="Search games" />
        <kbd aria-hidden="true">/</kbd>
      </label>
      <div class="account-slot" id="account"></div>
    </div>
  </header>

  <!-- Live strip: players online, chat, the latest announcement, what's new (fp/ticker.js) -->
  <div class="live-strip" id="ticker" hidden></div>

  <main class="wrap">
    <h1 class="sr-only">Free Period: games made by us, for us</h1>
    <section class="streak-slot" id="streak" aria-label="Daily streak" hidden></section>

    <section id="hero" class="hero-slot" aria-label="Featured games"></section>

    <!-- data-reveal: fades/rises in once it scrolls into view (fp/motion.js; shown at once if that never runs) -->
    <section class="friends-now" id="friends-now" data-reveal hidden></section>

    <section class="recent" id="recent" aria-labelledby="recent-h" data-reveal hidden>
      <div class="section-head"><h2 id="recent-h">Jump back in</h2></div>
      <div class="recent-row" id="recent-row"></div>
    </section>

    <!-- Home panels: one row of cards that share the width (each hidden panel takes no room). Another small panel can
         join with <section class="hp ..."> here; .hp gives the card look. -->
    <div class="home-row" id="home-row">
      <section class="hp hp-new" id="whatsnew" aria-labelledby="whatsnew-h" data-reveal></section>
      <section class="hp hp-trophies" id="trophy-teaser" aria-labelledby="trophy-teaser-h" data-reveal hidden></section>
    </div>

    <!-- Top players (fp/top-players.js, the leaderboards branch): every game's top 3, full width under the panels -->
    <section class="tops" id="tops" aria-label="Top players" data-reveal hidden></section>

    <section class="fp-suggest-section" id="suggest" aria-label="Tell Sean" data-reveal></section>

    <section class="games" aria-labelledby="games-h">
      <div class="section-head" data-reveal>
        <h2 id="games-h">All games</h2>
        <span class="count" id="count"></span>
        <div class="chips" id="chips"></div>
      </div>
      <div class="grid" id="grid"></div>
      <p class="empty" id="empty" hidden>No games match that. Yet.</p>
    </section>

  </main>

  <footer class="wrap foot">
    <span class="foot-brand"><b>FREE PERIOD</b> · games made by us, for us</span>
    <span id="foot-count"></span>
    <span class="foot-keys"><kbd>/</kbd> search</span>
  </footer>

  <script src="games.js"></script>
  <script type="module" src="fp/home.js"></script>
</body>
</html>
